<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SatyaDrishti Complaint Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .dashboard-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .dashboard-nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: var(--spacing-md) var(--spacing-lg);
    }
    
    .dashboard-nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .dashboard-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-weight: 600;
      font-size: 1.125rem;
    }
    
    .dashboard-brand-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .dashboard-user {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    
    .dashboard-user-info {
      text-align: right;
    }
    
    .dashboard-user-name {
      font-weight: 600;
      font-size: 0.875rem;
    }
    
    .dashboard-user-email {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .dashboard-main {
      flex: 1;
      padding: var(--spacing-xl) var(--spacing-lg);
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }
    
    .dashboard-header {
      margin-bottom: var(--spacing-xl);
    }
    
    .dashboard-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: var(--spacing-xs);
    }
    
    .dashboard-subtitle {
      color: var(--text-secondary);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
    }
    
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      transition: all 0.2s ease;
    }
    
    .stat-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }
    
    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-md);
    }
    
    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .stat-icon-primary {
      background: #DBEAFE;
      color: var(--primary);
    }
    
    .stat-icon-warning {
      background: var(--warning-bg);
      color: #92400E;
    }
    
    .stat-icon-success {
      background: var(--success-bg);
      color: #166534;
    }
    
    .stat-icon-info {
      background: #DBEAFE;
      color: var(--primary);
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--spacing-xs);
    }
    
    .stat-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--spacing-lg);
    }
    
    .complaints-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
    }
    
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-lg);
    }
    
    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }
    
    .complaint-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }
    
    .complaint-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
    }
    
    .complaint-item:hover {
      border-color: var(--border-hover);
      background: var(--background-hover);
    }
    
    .complaint-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    
    .complaint-content {
      flex: 1;
      min-width: 0;
    }
    
    .complaint-title {
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: var(--spacing-xs);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .complaint-meta {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .complaint-status {
      flex-shrink: 0;
    }
    
    .quick-actions {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
    }
    
    .action-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .action-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .action-item:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #EFF6FF;
    }
    
    .empty-state {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--text-muted);
    }
    
    .empty-state-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--spacing-md);
      color: var(--text-muted);
    }
    
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
    }
    
    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 768px) {
      .dashboard-nav-inner {
        flex-direction: column;
        gap: var(--spacing-md);
      }
      
      .dashboard-user {
        width: 100%;
        justify-content: space-between;
      }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .dashboard-title {
        font-size: 1.5rem;
      }
    }
    
    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      
      .complaint-item {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .complaint-status {
        width: 100%;
        margin-top: var(--spacing-sm);
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <!-- Navigation -->
    <nav class="dashboard-nav">
      <div class="dashboard-nav-inner">
        <div class="dashboard-brand">
          <div class="dashboard-brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span>SatyaDrishti</span>
        </div>
        <div class="dashboard-user">
          <div class="dashboard-user-info">
            <div class="dashboard-user-name" id="userName">Loading...</div>
            <div class="dashboard-user-email" id="userEmail">...</div>
          </div>
          <button class="btn btn-outline btn-sm" id="logoutBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div class="dashboard-header">
        <h1 class="dashboard-title">Welcome back, <span id="userNameTitle">User</span></h1>
        <p class="dashboard-subtitle">Manage your complaints and track their status</p>
      </div>

      <!-- Statistics -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon stat-icon-primary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="totalComplaints">-</div>
          <div class="stat-label">Total Complaints</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon stat-icon-warning">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="pendingComplaints">-</div>
          <div class="stat-label">Pending</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon stat-icon-info">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="inProgressComplaints">-</div>
          <div class="stat-label">In Progress</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon stat-icon-success">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="resolvedComplaints">-</div>
          <div class="stat-label">Resolved</div>
        </div>
      </div>

      <!-- Dashboard Grid -->
      <div class="dashboard-grid">
        <!-- Recent Complaints -->
        <div class="complaints-section">
          <div class="section-header">
            <h2 class="section-title">Recent Complaints</h2>
            <button class="btn btn-primary btn-sm" id="newComplaintBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              New Complaint
            </button>
          </div>
          <div class="complaint-list" id="complaintList">
            <div class="loading-spinner">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
          <h2 class="section-title" style="margin-bottom: var(--spacing-lg);">Quick Actions</h2>
          <div class="action-list">
            <div class="action-item" onclick="window.location.href='/new-complaint'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              File New Complaint
            </div>
            <div class="action-item" onclick="window.location.href='/my-complaints'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              View All Complaints
            </div>
            <div class="action-item" onclick="window.location.href='/profile'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              Update Profile
            </div>
            <div class="action-item" onclick="window.location.href='/help'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
              Get Help
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/auth.js"></script>
  <script src="/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      SatyaAuth.guardDashboard();
      SatyaAuth.initLogout();
      Dashboard.init();
    });
  </script>
</body>
</html>
