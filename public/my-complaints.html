<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints — SatyaDrishti Complaint Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .page-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--background);
    }
    
    .page-nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: var(--spacing-md) var(--spacing-lg);
    }
    
    .page-nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .page-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-weight: 600;
      font-size: 1.125rem;
    }
    
    .page-brand-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .page-main {
      flex: 1;
      padding: var(--spacing-xl) var(--spacing-lg);
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }
    
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-xl);
      flex-wrap: wrap;
      gap: var(--spacing-md);
    }
    
    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: var(--spacing-xs);
    }
    
    .page-subtitle {
      color: var(--text-secondary);
    }
    
    .filters {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: var(--spacing-xs) var(--spacing-md);
      font-size: 0.875rem;
      font-weight: 500;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .filter-btn:hover {
      border-color: var(--border-hover);
      background: var(--background-hover);
    }
    
    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    
    .complaints-grid {
      display: grid;
      gap: var(--spacing-md);
    }
    
    .complaint-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      transition: all 0.2s ease;
    }
    
    .complaint-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }
    
    .complaint-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    
    .complaint-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
    }
    
    .complaint-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    
    .complaint-body {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: var(--spacing-md);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .complaint-meta {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .complaint-meta-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .complaint-actions {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--border);
    }
    
    .empty-state {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--text-muted);
    }
    
    .empty-state-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--spacing-md);
      color: var(--text-muted);
    }
    
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
    }
    
    @media (max-width: 768px) {
      .page-header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .filters {
        width: 100%;
      }
      
      .complaint-header {
        flex-direction: column;
      }
      
      .complaint-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="page-layout">
    <!-- Navigation -->
    <nav class="page-nav">
      <div class="page-nav-inner">
        <div class="page-brand">
          <div class="page-brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span>SatyaDrishti</span>
        </div>
        <div style="display: flex; gap: var(--spacing-sm);">
          <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
          <a href="/new-complaint" class="btn btn-primary btn-sm">New Complaint</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="page-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">My Complaints</h1>
          <p class="page-subtitle">View and manage all your submitted complaints</p>
        </div>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="in_progress">In Progress</button>
          <button class="filter-btn" data-filter="resolved">Resolved</button>
        </div>
      </div>

      <div class="complaints-grid" id="complaintsGrid">
        <div class="loading-spinner">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/auth.js"></script>
  <script src="/my-complaints.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      SatyaAuth.guardDashboard();
      MyComplaints.init();
    });
  </script>
</body>
</html>
